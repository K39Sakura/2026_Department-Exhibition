name: 'My JavaScript Action'
description: 'Greet someone and record the time'
inputs:
  who-to-greet:
    description: 'Who to greet'
    required: true
    default: 'World'
outputs:
  time:
    description: 'The time we greeted you'

# ここでランタイムと実行ファイル（パス）を指定
runs:
  using: 'node24'      # 使用する Node.js のバージョン (例: node20, node16 など)
  main: 'dist/sample.js' # 実行されるエントリーポイントのJavaScriptファイル
